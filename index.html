<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KRAKN·AI</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Reset & Root ─────────────────────────────────────────── */
:root {
  --black:   #000000;
  --s1:      rgba(0,212,255,0.04);
  --s2:      rgba(0,212,255,0.07);
  --s3:      rgba(0,212,255,0.10);
  --border:  rgba(0,212,255,0.10);
  --border2: rgba(0,212,255,0.16);
  --white:   #FFFFFF;
  --grey1:   #94A3B8;
  --grey2:   #475569;
  --grey3:   #1E293B;
  --cyan:    #00D4FF;
  --green:   #00C896;
  --red:     #FF4466;
  --yellow:  #FFB800;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{
  height:100%;
  background:#000;
  color:var(--white);
  font-family:'Space Grotesk',sans-serif;
  overflow:hidden;
}
body::before{
  content:'';
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 15% 10%, rgba(0,212,255,0.06) 0%, transparent 70%),
    radial-gradient(ellipse 50% 50% at 85% 85%, rgba(0,100,180,0.05) 0%, transparent 70%);
}

/* ── App Shell ────────────────────────────────────────────── */
#app{
  position:relative; z-index:1;
  height:100vh; display:flex; flex-direction:column;
  max-width:430px; margin:0 auto;
}

/* ── Header ───────────────────────────────────────────────── */
.header{
  padding:14px 18px 12px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  position:sticky; top:0; z-index:100;
}
.logo{
  font-family:'Space Mono',monospace;
  font-size:17px; font-weight:700; letter-spacing:0.08em;
  background:linear-gradient(135deg,#fff 30%,#00D4FF);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.logo-dot{ -webkit-text-fill-color:#00D4FF; }
.status-pill{
  display:flex; align-items:center; gap:6px;
  padding:5px 12px; border-radius:20px;
  background:rgba(0,212,255,0.06);
  border:1px solid var(--border2);
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:600; letter-spacing:0.06em;
  color:var(--grey1);
}
.status-dot{ width:6px; height:6px; border-radius:50%; background:var(--green); flex-shrink:0; }
.status-dot.offline{ background:var(--red); }
.status-dot.pulse{ animation:statusPulse 2s infinite; }
@keyframes statusPulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(0,200,150,0.5); }
  50%{ box-shadow:0 0 0 5px rgba(0,200,150,0); }
}

/* ── Content ──────────────────────────────────────────────── */
.content{
  flex:1; overflow-y:auto; overflow-x:hidden;
  padding:0 0 76px;
  -webkit-overflow-scrolling:touch;
}
.content::-webkit-scrollbar{ display:none; }

/* ── Glass Card ───────────────────────────────────────────── */
.glass{
  background:linear-gradient(135deg,rgba(0,212,255,0.07),rgba(0,212,255,0.02));
  border:1px solid var(--border);
  border-radius:18px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
.glass-dark{
  background:rgba(0,0,0,0.4);
  border:1px solid var(--border);
  border-radius:16px;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

/* ── Coin Selector ────────────────────────────────────────── */
.coin-rail{
  display:flex; gap:0; overflow-x:auto;
  border-bottom:1px solid var(--border);
  -webkit-overflow-scrolling:touch;
  background:rgba(0,0,0,0.3);
}
.coin-rail::-webkit-scrollbar{ display:none; }
.coin-tab{
  flex-shrink:0; padding:11px 16px;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:600; letter-spacing:0.06em;
  color:var(--grey2); cursor:pointer;
  border-bottom:2px solid transparent;
  border-top:none; border-left:none; border-right:none;
  transition:all 0.15s; white-space:nowrap;
  background:none;
}
.coin-tab.active{
  color:var(--cyan);
  border-bottom-color:var(--cyan);
}
.coin-tab:active{ opacity:0.7; }

/* ── Hero Price ───────────────────────────────────────────── */
.hero{
  padding:20px 18px 18px;
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.2);
}
.hero-top{
  display:flex; align-items:flex-start;
  justify-content:space-between; margin-bottom:3px;
}
.hero-pair{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.14em;
  color:rgba(0,212,255,0.5); text-transform:uppercase;
}
.hero-badge{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.06em;
  padding:3px 10px; border-radius:20px;
}
.hero-badge.up{ background:rgba(0,200,150,0.1); color:var(--green); border:1px solid rgba(0,200,150,0.2); }
.hero-badge.down{ background:rgba(255,68,102,0.1); color:var(--red); border:1px solid rgba(255,68,102,0.2); }
.hero-price{
  font-family:'Space Grotesk',sans-serif;
  font-size:48px; font-weight:700; letter-spacing:-0.03em;
  line-height:1; margin-bottom:5px;
  background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.hero-price-sub{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; color:var(--grey1); margin-bottom:18px;
}
.hero-stats{
  display:grid; grid-template-columns:1fr 1px 1fr 1px 1fr;
  background:rgba(0,212,255,0.04);
  border:1px solid var(--border);
  border-radius:12px; overflow:hidden;
}
.hero-stat{ padding:10px 12px; }
.hero-stat-divider{ background:var(--border); }
.hero-stat-val{
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:600; color:var(--white); margin-bottom:2px;
}
.hero-stat-key{
  font-size:9px; font-weight:700; letter-spacing:0.12em;
  color:var(--grey2); text-transform:uppercase;
}

/* ── Chart ────────────────────────────────────────────────── */
.chart-section{ padding:0 18px 16px; }
.chart-tfs{
  display:flex; gap:4px; margin-bottom:10px; padding-top:16px;
}
.tf{
  padding:5px 12px; border-radius:20px;
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.06em;
  cursor:pointer; border:1px solid var(--border);
  color:var(--grey2); background:none; transition:all 0.15s;
}
.tf.active{
  background:rgba(0,212,255,0.15);
  border-color:var(--cyan); color:var(--cyan);
}
canvas{ width:100%!important; display:block; }

/* ── AI Signal ────────────────────────────────────────────── */
.signal-strip{
  margin:0 18px;
  border-radius:14px; overflow:hidden;
  background:linear-gradient(135deg,rgba(0,212,255,0.07),rgba(0,212,255,0.02));
  border:1px solid var(--border2);
}
.signal-strip-inner{ display:flex; align-items:stretch; }
.signal-action-block{
  padding:14px 16px;
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  min-width:76px; gap:2px;
  border-right:1px solid var(--border);
  border-radius:14px 0 0 14px;
}
.signal-action-block.buy{ background:rgba(0,200,150,0.1); }
.signal-action-block.sell{ background:rgba(255,68,102,0.1); }
.signal-action-block.hold{ background:rgba(255,184,0,0.07); }
.signal-word{
  font-family:'Space Grotesk',sans-serif;
  font-size:16px; font-weight:700; letter-spacing:0.05em;
}
.signal-word.buy{ color:var(--green); }
.signal-word.sell{ color:var(--red); }
.signal-word.hold{ color:var(--yellow); }
.signal-conf{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:600; color:var(--grey1); letter-spacing:0.04em;
}
.signal-info{
  flex:1; padding:12px 14px;
  display:flex; flex-direction:column; justify-content:center; gap:4px;
}
.signal-reason{ font-size:12px; color:var(--grey1); line-height:1.5; }
.signal-suggestion{
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:600; color:var(--cyan);
}
.signal-refresh{
  padding:14px 12px;
  display:flex; align-items:center; justify-content:center;
  border-left:1px solid var(--border); cursor:pointer;
  color:var(--grey2); font-size:16px;
  background:none; border-top:none; border-bottom:none; border-right:none;
  transition:color 0.15s;
}
.signal-refresh:active{ color:var(--cyan); }

/* ── Section Label ────────────────────────────────────────── */
.section-label{
  padding:18px 18px 10px;
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.14em;
  color:var(--grey2); text-transform:uppercase;
  display:flex; align-items:center; justify-content:space-between;
}
.section-head-line{
  flex:1; height:1px; background:var(--border); margin-left:10px;
}
.section-label-action{
  font-size:10px; color:var(--cyan); cursor:pointer; letter-spacing:0.06em;
}

/* ── Markets Grid ─────────────────────────────────────────── */
.markets{
  padding:0 18px; display:grid;
  grid-template-columns:1fr 1fr; gap:8px; margin-bottom:4px;
}
.market-tile{
  padding:14px; border-radius:14px;
  background:rgba(0,212,255,0.04);
  border:1px solid var(--border);
  cursor:pointer; transition:all 0.15s; position:relative; overflow:hidden;
}
.market-tile:active{ opacity:0.8; transform:scale(0.98); }
.market-tile.active{
  border-color:rgba(0,212,255,0.3);
  background:rgba(0,212,255,0.08);
  box-shadow:0 0 20px rgba(0,212,255,0.05);
}
.market-tile-sym{
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.08em;
  color:var(--grey1); margin-bottom:6px;
  display:flex; align-items:center; justify-content:space-between;
}
.market-sig-dot{ width:5px; height:5px; border-radius:50%; }
.market-tile-price{
  font-family:'Space Grotesk',sans-serif;
  font-size:15px; font-weight:700; color:var(--white);
  margin-bottom:2px; letter-spacing:-0.01em;
}
.market-tile-chg{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:600;
}
.market-tile-bar{
  position:absolute; bottom:0; left:0; height:2px; transition:width 0.6s;
}
.up{ color:var(--green); }
.down{ color:var(--red); }

/* ── Alerts Compact ───────────────────────────────────────── */
.alerts-compact{
  margin:0 18px;
  border:1px solid var(--border); border-radius:14px;
  overflow:hidden; margin-bottom:4px;
  background:rgba(0,0,0,0.3);
}
.alert-row-compact{
  display:flex; align-items:center; justify-content:space-between;
  padding:11px 14px; border-bottom:1px solid var(--border);
}
.alert-row-compact:last-child{ border-bottom:none; }
.alert-pill{
  font-family:'Space Grotesk',sans-serif;
  font-size:9px; font-weight:700; letter-spacing:0.1em;
  padding:2px 7px; border-radius:20px; text-transform:uppercase;
}
.pill-above{ background:rgba(0,200,150,0.1); color:var(--green); border:1px solid rgba(0,200,150,0.2); }
.pill-below{ background:rgba(255,68,102,0.1); color:var(--red); border:1px solid rgba(255,68,102,0.2); }
.badge-triggered{ background:rgba(255,184,0,0.1); color:var(--yellow); }
.alert-compact-text{
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:600; color:var(--white); margin-left:8px;
}
.alert-compact-status{ font-family:'Space Grotesk',sans-serif; font-size:11px; color:var(--grey2); }

/* ── Quick Actions ────────────────────────────────────────── */
.quick-actions{
  padding:0 18px; display:grid;
  grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px;
}
.qa-btn{
  padding:13px; border-radius:12px;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:700; letter-spacing:0.04em;
  cursor:pointer; transition:all 0.15s; text-align:center;
  border:1px solid var(--border);
}
.qa-btn:active{ transform:scale(0.96); }
.qa-buy{ background:rgba(0,200,150,0.1); border-color:rgba(0,200,150,0.25); color:var(--green); }
.qa-sell{ background:rgba(255,68,102,0.1); border-color:rgba(255,68,102,0.25); color:var(--red); }
.qa-ai{ background:rgba(0,212,255,0.07); border-color:rgba(0,212,255,0.2); color:var(--cyan); }
.qa-alert{ background:rgba(255,255,255,0.03); color:var(--grey1); }

/* ── General Card ─────────────────────────────────────────── */
.card{
  margin:0 18px;
  background:rgba(0,0,0,0.3);
  border:1px solid var(--border); border-radius:14px;
  overflow:hidden; margin-bottom:8px;
}
.card-body{ padding:16px; }

/* ── Form Elements ────────────────────────────────────────── */
.field-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.12em;
  color:var(--grey2); text-transform:uppercase; margin-bottom:6px;
}
.input{
  width:100%;
  background:rgba(0,212,255,0.04);
  border:1px solid var(--border2); border-radius:10px;
  padding:11px 14px; color:var(--white);
  font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:500;
  margin-bottom:12px; outline:none; transition:all 0.15s;
  -webkit-appearance:none;
}
.input:focus{ border-color:var(--cyan); background:rgba(0,212,255,0.07); }
select.input{ cursor:pointer; }

/* ── Buttons ──────────────────────────────────────────────── */
.btn{
  width:100%; padding:14px; border:none; border-radius:12px;
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:700; letter-spacing:0.06em;
  cursor:pointer; transition:all 0.15s; text-transform:uppercase;
}
.btn:active{ transform:scale(0.97); }
.btn-buy{ background:linear-gradient(135deg,#00C896,#009970); color:#000; }
.btn-sell{ background:linear-gradient(135deg,#FF4466,#CC2244); color:#fff; }
.btn-cyan{ background:linear-gradient(135deg,#00D4FF,#0099BB); color:#000; }
.btn-ghost{ background:rgba(255,255,255,0.04); border:1px solid var(--border2); color:var(--grey1); }
.btn-telegram{ background:#229ED9; color:#fff; }
.btn-danger{ background:rgba(255,68,102,0.15); border:1px solid rgba(255,68,102,0.3); color:var(--red); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* ── Trade Tabs ───────────────────────────────────────────── */
.trade-tabs{
  display:flex; background:rgba(0,0,0,0.3); border-radius:10px;
  padding:3px; gap:3px; margin-bottom:16px;
  border:1px solid var(--border);
}
.trade-tab{
  flex:1; padding:10px; text-align:center; cursor:pointer;
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.08em;
  color:var(--grey2); border-radius:8px;
  background:none; border:none; transition:all 0.15s;
}
.trade-tab.buy.active{ background:rgba(0,200,150,0.15); color:var(--green); }
.trade-tab.sell.active{ background:rgba(255,68,102,0.15); color:var(--red); }
.trade-tab.futures.active{ background:rgba(0,212,255,0.15); color:var(--cyan); }

/* ── Holdings ─────────────────────────────────────────────── */
.holding-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0; border-bottom:1px solid var(--border);
}
.holding-row:last-child{ border-bottom:none; }
.holding-icon{
  width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Space Grotesk',sans-serif;
  font-size:13px; font-weight:700; flex-shrink:0;
}
.holding-name{ font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600; }
.holding-qty{ font-size:11px; color:var(--grey2); margin-top:1px; }
.holding-val{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; text-align:right; }
.holding-chg{ font-family:'Space Grotesk',sans-serif; font-size:11px; font-weight:600; text-align:right; margin-top:1px; }

/* ── Order Rows ───────────────────────────────────────────── */
.order-row{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.order-row:last-child{ border-bottom:none; }
.order-badge{
  font-family:'Space Grotesk',sans-serif;
  font-size:9px; font-weight:700; letter-spacing:0.1em;
  padding:2px 8px; border-radius:20px; text-transform:uppercase;
}
.badge-buy{ background:rgba(0,200,150,0.1); color:var(--green); border:1px solid rgba(0,200,150,0.2); }
.badge-sell{ background:rgba(255,68,102,0.1); color:var(--red); border:1px solid rgba(255,68,102,0.2); }

/* ── Bot Card ─────────────────────────────────────────────── */
.bot-header{
  padding:16px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.bot-title{ font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:700; }
.bot-subtitle{ font-size:11px; color:var(--grey2); margin-top:2px; }
.running-badge{
  font-family:'Space Grotesk',sans-serif;
  font-size:10px; font-weight:700; letter-spacing:0.1em;
  padding:4px 12px; border-radius:20px; text-transform:uppercase;
}
.running-badge.on{ background:rgba(0,200,150,0.1); color:var(--green); border:1px solid rgba(0,200,150,0.2); }
.running-badge.off{ background:rgba(255,255,255,0.04); color:var(--grey2); border:1px solid var(--border); }

/* ── Interval Pills ───────────────────────────────────────── */
.interval-pills{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
.interval-pill{
  padding:6px 14px; border-radius:20px;
  font-family:'Space Grotesk',sans-serif;
  font-size:11px; font-weight:700; letter-spacing:0.06em;
  cursor:pointer; border:1px solid var(--border);
  color:var(--grey2); background:none; transition:all 0.15s;
}
.interval-pill.active{ background:rgba(0,212,255,0.15); border-color:var(--cyan); color:var(--cyan); }

/* ── Alert Rows ───────────────────────────────────────────── */
.alert-item{
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.alert-item:last-child{ border-bottom:none; }

/* ── Bottom Nav ───────────────────────────────────────────── */
.bottom-nav{
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px;
  background:rgba(0,0,0,0.85);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  display:flex; padding:8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index:100;
}
.nav-btn{
  flex:1; display:flex; flex-direction:column;
  align-items:center; gap:3px; cursor:pointer;
  padding:5px 0; opacity:0.3; transition:opacity 0.15s;
  background:none; border:none;
}
.nav-btn.active{ opacity:1; }
.nav-icon{ font-size:18px; line-height:1; }
.nav-label{
  font-family:'Space Grotesk',sans-serif;
  font-size:9px; font-weight:700; letter-spacing:0.08em;
  color:var(--grey1); text-transform:uppercase;
}
.nav-btn.active .nav-label{ color:var(--cyan); }

/* ── Loading ──────────────────────────────────────────────── */
.loading{
  display:flex; align-items:center; gap:8px;
  color:var(--grey2); font-size:12px; padding:8px 0;
  font-family:'Space Grotesk',sans-serif;
}
.spin{
  width:14px; height:14px; border-radius:50%;
  border:2px solid var(--border2); border-top-color:var(--cyan);
  animation:spin 0.7s linear infinite; flex-shrink:0;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ── Toast ────────────────────────────────────────────────── */
.toast{
  position:fixed; top:72px; left:50%; transform:translateX(-50%);
  background:rgba(0,0,0,0.9);
  border:1px solid var(--border2); border-radius:20px;
  padding:10px 20px;
  font-family:'Space Grotesk',sans-serif;
  font-size:12px; font-weight:600; letter-spacing:0.04em;
  z-index:999;
  box-shadow:0 8px 32px rgba(0,0,0,0.8),0 0 0 1px rgba(0,212,255,0.1);
  animation:toastIn 0.2s ease; white-space:nowrap;
  max-width:88vw; text-align:center;
  backdrop-filter:blur(20px);
}
@keyframes toastIn{ from{ opacity:0; top:60px; } to{ opacity:1; top:72px; } }

/* ── Banners ──────────────────────────────────────────────── */
.banner{
  margin:14px 18px 0; padding:12px 14px;
  border-radius:12px; font-size:12px; line-height:1.6;
}
.banner a{ color:var(--cyan); text-decoration:none; }
.banner-warn{ background:rgba(255,184,0,0.06); border:1px solid rgba(255,184,0,0.2); color:var(--grey1); }
.banner-ok{ background:rgba(0,200,150,0.06); border:1px solid rgba(0,200,150,0.2); color:var(--grey1); }

/* ── Misc ─────────────────────────────────────────────────── */
.divider{ height:1px; background:var(--border); margin:0 18px; }
.spacer{ height:8px; }
.mono{ font-family:'Space Grotesk',sans-serif; font-weight:600; }
.fade-in{ animation:fadeIn 0.25s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
.btn-telegram{ background:rgba(34,158,217,0.15); border:1px solid rgba(34,158,217,0.3); color:#229ED9; }
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <div class="logo">KRAKN<span class="logo-dot">·</span>AI</div>
      <div id="versionBadge" style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;
        letter-spacing:0.1em;padding:2px 8px;border-radius:20px;
        background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.2);
        color:rgba(0,212,255,0.6)">v4.0</div>
    </div>
    <div class="status-pill">
      <div class="status-dot pulse" id="statusDot"></div>
      <span id="statusTxt">CONNECTING</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content" id="mainContent"></div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showTab('dashboard')" id="nav-dashboard">
      <div class="nav-icon">◈</div><div class="nav-label">Markets</div>
    </button>
    <button class="nav-btn" onclick="showTab('trade')" id="nav-trade">
      <div class="nav-icon">⇅</div><div class="nav-label">Trade</div>
    </button>
    <button class="nav-btn" onclick="showTab('portfolio')" id="nav-portfolio">
      <div class="nav-icon">◫</div><div class="nav-label">Portfolio</div>
    </button>
    <button class="nav-btn" onclick="showTab('alerts')" id="nav-alerts">
      <div class="nav-icon">◎</div><div class="nav-label">Alerts</div>
    </button>
    <button class="nav-btn" onclick="showTab('bot')" id="nav-bot">
      <div class="nav-icon">⟳</div><div class="nav-label">Auto-Sell</div>
    </button>
    <button class="nav-btn" onclick="showTab('settings')" id="nav-settings">
      <div class="nav-icon">◉</div><div class="nav-label">Settings</div>
    </button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────
let currentTab     = 'dashboard';
let selectedPair   = 'XBTAUD';
let chartTF        = '1H';
let tradeMode      = 'buy';
let serverOnline   = false;
let aiCache        = {};
let advisorCfg     = { enabled:true, intervalHours:1, minConfidence:65, includeNews:true };
let botActive      = false;
let botCfg         = { sellPct:100, confidenceMin:75, riskLevel:'conservative', minHoldingValueAUD:50, stopLossEnabled:true, stopLossPct:8, trailingStop:false };
let botLastSignals = {};
let dcaCfg         = { enabled:false, pairs:['XBTAUD'], amountAUD:50, frequency:'weekly', totalSpent:0, lastRun:null };
let pnlData        = null; // cached P&L from server

let cfg = {
  serverUrl: localStorage.getItem('serverUrl') || '',
  botToken:  localStorage.getItem('botToken')  || '',
};

let prices = {}, balance = {}, openOrders = {}, myAlerts = [];

const PAIRS   = ['XBTAUD','ETHAUD','SOLAUD','XRPAUD','ADAAUD','LTCAUD','DOTAUD','LINKAUD'];
const DISPLAY = { XBTAUD:'BTC/AUD', ETHAUD:'ETH/AUD', SOLAUD:'SOL/AUD', XRPAUD:'XRP/AUD', ADAAUD:'ADA/AUD', LTCAUD:'LTC/AUD', DOTAUD:'DOT/AUD', LINKAUD:'LINK/AUD' };
const COLORS  = { BTC:'#F7931A', ETH:'#627EEA', SOL:'#9945FF', XRP:'#346AA9', ADA:'#0D9488', LTC:'#BFBBBB', DOT:'#E6007A', LINK:'#2A5ADA' };
const ICONS   = { BTC:'₿', ETH:'Ξ', SOL:'◎', XRP:'✕', ADA:'₳', LTC:'Ł', DOT:'●', LINK:'⬡' };

function sym(pair)  { return (DISPLAY[pair]||pair).replace('/AUD',''); }
function coin(pair) { return sym(pair); }

function fmtAUD(p) {
  if (p === null || p === undefined || isNaN(p)) return '--';
  if (p >= 10000) return '$' + Math.round(p).toLocaleString('en-AU');
  if (p >= 100)   return '$' + p.toLocaleString('en-AU', {minimumFractionDigits:2, maximumFractionDigits:2});
  if (p >= 0.01)  return '$' + parseFloat(p).toFixed(2);
  if (p > 0)      return '$' + parseFloat(p).toFixed(4);
  return '$0.00';
}
function fmtAUDCompact(p) {
  if (!p) return '--';
  if (p >= 1000) return '$' + (p/1000).toFixed(1) + 'k';
  return '$' + parseFloat(p).toFixed(2);
}
function getAUDCash() {
  // Include ZAUD, AUD and AUDX — all pegged 1:1 to AUD
  return Object.entries(balance).reduce((s,[a,q]) =>
    (a==='ZAUD'||a==='AUD'||a==='AUDX') ? s+parseFloat(q) : s, 0);
}

// ── API ───────────────────────────────────────────────────────
async function api(path, opts={}) {
  if (!cfg.serverUrl) throw new Error('Server URL not configured');
  const url = cfg.serverUrl.replace(/\/$/,'') + path;
  const headers = { 'Content-Type':'application/json' };
  if (cfg.botToken) headers['Authorization'] = 'Bearer ' + cfg.botToken;
  const res = await fetch(url, { ...opts, headers:{ ...headers, ...(opts.headers||{}) } });
  if (!res.ok) {
    const e = await res.json().catch(()=>({ error:res.statusText }));
    throw new Error(e.error || res.statusText);
  }
  return res.json();
}

async function checkServer() {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusTxt');
  try {
    const d = await api('/health');
    serverOnline = true;
    if (dot) { dot.className='status-dot pulse'; }
    if (txt) txt.textContent = d.keysConfigured ? 'LIVE' : 'NO KEYS';
    if (d.advisorInterval) advisorCfg.intervalHours = d.advisorInterval;
    // Update version badge
    if (d.version) {
      const vb = document.getElementById('versionBadge');
      if (vb) vb.textContent = 'v' + d.version;
    }
  } catch {
    serverOnline = false;
    if (dot) { dot.className='status-dot offline'; }
    if (txt) txt.textContent = cfg.serverUrl ? 'OFFLINE' : 'SETUP';
  }
}

async function refreshPrices() {
  try {
    const r = await api('/api/ticker?pairs=' + PAIRS.join(','));
    if (r.data && Object.keys(r.data).length) {
      prices = r.data;
      if (currentTab === 'dashboard') updateLivePrices();
    }
  } catch(e) { console.warn('Prices:', e.message); }
}

async function refreshBalance() {
  if (!serverOnline || !cfg.botToken) return;
  try { balance = (await api('/api/balance')).data || {}; } catch(e) {}
}
async function refreshOrders() {
  if (!serverOnline || !cfg.botToken) return;
  try { openOrders = (await api('/api/orders/open')).data || {}; } catch(e) {}
}
async function refreshAlerts() {
  if (!serverOnline || !cfg.botToken) return;
  try { myAlerts = (await api('/api/alerts')).data || []; } catch(e) {}
}

async function refreshPnL() {
  if (!serverOnline || !cfg.botToken) return;
  try {
    const res = await api('/api/pnl');
    pnlData   = res.data || null;
    if (currentTab === 'dashboard') updateDashboardPnL();
  } catch(e) {}
}

function updateDashboardPnL() {
  if (!pnlData) return;
  const totalEl     = document.getElementById('dashPnlTotal');
  const realisedEl  = document.getElementById('dashPnlRealised');
  const unrealEl    = document.getElementById('dashPnlUnreal');
  if (totalEl) {
    const t = pnlData.totalPnl || 0;
    totalEl.textContent  = (t >= 0 ? '+' : '') + fmtAUD(t);
    totalEl.style.color  = t >= 0 ? 'var(--green)' : 'var(--red)';
  }
  if (realisedEl) {
    const r = pnlData.totalRealisedPnl || 0;
    realisedEl.textContent = (r >= 0 ? '+' : '') + fmtAUD(r);
    realisedEl.style.color = r >= 0 ? 'var(--green)' : 'var(--red)';
  }
  if (unrealEl) {
    const u = pnlData.totalUnrealisedPnl || 0;
    unrealEl.textContent = (u >= 0 ? '+' : '') + fmtAUD(u);
    unrealEl.style.color = u >= 0 ? 'var(--green)' : 'var(--red)';
  }
}

// ── Dashboard ─────────────────────────────────────────────────
function renderDashboard() {
  // ── Calculate portfolio values ────────────────────────────
  const entries    = Object.entries(balance || {});
  let totalPortfolio = 0, totalInvested = 0;
  const holdingRows = [];

  entries.filter(([,q]) => parseFloat(q) > 0.000001).forEach(([asset, qty]) => {
    let pr    = 0;
    let isCash = false;
    let s = asset;

    // Cash assets — value at exactly 1 AUD
    if (['ZAUD','AUD','AUDX'].includes(asset)) {
      pr = 1; isCash = true; s = 'AUD';
    }
    // USD stablecoins — convert at live rate (approx 1.55) but mark as cash
    else if (['USDC','ZUSD','USD'].includes(asset)) {
      pr = 1.55; isCash = true; s = 'USD';
    }
    else {
      // Crypto — strip Kraken prefixes to get clean symbol
      s = asset.replace(/^X/,'').replace(/^Z/,'').replace('XBT','BTC');
      // Find matching AUD price pair
      const pk = Object.keys(prices).find(k =>
        k === s+'AUD' || k === 'XBT'+'AUD' && s==='BTC' ||
        k.startsWith(s==='BTC'?'XBT':s)
      );
      pr = pk ? prices[pk].price : 0;
    }

    const val = parseFloat(qty) * pr;
    if (val < 0.01) return; // skip dust
    totalPortfolio += val;
    if (!isCash && val > 0) totalInvested += val;

    const chgKey = !isCash ? Object.keys(prices).find(k =>
      k === (s==='BTC'?'XBT':s)+'AUD' || k.startsWith(s==='BTC'?'XBT':s)
    ) : null;

    holdingRows.push({ s, qty: parseFloat(qty), val, isCash, asset,
      chg: chgKey ? parseFloat(prices[chgKey]?.change24h||0) : 0
    });
  });

  const cashAvailable = totalPortfolio - totalInvested;
  const sig           = aiCache[selectedPair];
  const p             = prices[selectedPair] || {};
  const chg           = parseFloat(p.change24h || 0);
  const s             = sym(selectedPair);
  const activeAlerts  = myAlerts.filter(a => !a.triggered);

  // P&L values
  const totalPnl     = pnlData?.totalPnl || 0;
  const realisedPnl  = pnlData?.totalRealisedPnl || 0;
  const unrealisedPnl= pnlData?.totalUnrealisedPnl || 0;
  const hasPnl       = !!pnlData;
  const pnlAssets    = pnlData?.assetSummary || [];

  document.getElementById('mainContent').innerHTML = `<div class="fade-in">

    ${!cfg.serverUrl
      ? `<div class="banner banner-warn" style="margin:12px 16px 0">Server not configured — <a href="#" onclick="showTab('settings');return false">Settings →</a></div>`
      : !serverOnline
      ? `<div class="banner banner-warn" style="margin:12px 16px 0">Server offline. Check Railway is running.</div>`
      : ''}

    <!-- Portfolio Hero Card -->
    <div style="padding:16px 18px 0">
      <div style="background:linear-gradient(135deg,rgba(0,212,255,0.08),rgba(0,212,255,0.02));border:1px solid rgba(0,212,255,0.14);border-radius:20px;overflow:hidden;position:relative">
        <div style="position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:radial-gradient(circle,rgba(0,212,255,0.08),transparent 70%);border-radius:50%;pointer-events:none"></div>

        <!-- Total Value -->
        <div style="padding:20px 20px 16px;border-bottom:1px solid rgba(0,212,255,0.08)">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;color:rgba(0,212,255,0.5);text-transform:uppercase;margin-bottom:6px">
            Total Portfolio Value
          </div>
          <div style="font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));-webkit-background-clip:text;-webkit-text-fill-color:transparent" id="dashTotal">
            ${totalPortfolio > 0 ? fmtAUD(Math.round(totalPortfolio)) : '---'}
          </div>
          ${totalPortfolio > 0 ? `
          <div style="display:flex;gap:18px;margin-top:12px">
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--cyan)" id="dashInvested">${fmtAUD(Math.round(totalInvested))}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:2px">Invested</div>
            </div>
            <div style="width:1px;background:rgba(0,212,255,0.1)"></div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:var(--green)" id="dashCash">${fmtAUD(Math.round(cashAvailable))}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:2px">Available Cash</div>
            </div>
            <div style="width:1px;background:rgba(0,212,255,0.1)"></div>
            <div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;color:rgba(255,255,255,0.6)">${holdingRows.filter(h=>!h.isCash&&h.val>0).length}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.12em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:2px">Positions</div>
            </div>
          </div>` : '<div style="font-size:12px;color:var(--grey2);margin-top:8px;font-family:\'Space Grotesk\',sans-serif">Connect server in Settings to see live balance</div>'}
        </div>

        <!-- P&L Card -->
        <div style="padding:14px 20px" id="pnlCardSection">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.16em;color:rgba(0,212,255,0.5);text-transform:uppercase">
              Profit & Loss
            </div>
            ${hasPnl ? `
              <div style="display:flex;gap:8px;align-items:center">
                <button onclick="togglePnLBreakdown()" style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;color:var(--cyan);background:none;border:none;cursor:pointer;letter-spacing:0.06em" id="pnlBreakdownBtn">BREAKDOWN ▼</button>
                <button onclick="resetPnL()" style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;color:var(--grey2);background:none;border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:2px 8px;cursor:pointer">RESET</button>
              </div>` : ''}
          </div>

          ${hasPnl ? `
          <!-- P&L Summary Row -->
          <div style="display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;gap:0">
            <div style="text-align:center;padding:4px 0">
              <div style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:${totalPnl>=0?'var(--green)':'var(--red)'}" id="dashPnlTotal">${totalPnl>=0?'+':''}${fmtAUD(totalPnl)}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:3px">Total P&L</div>
            </div>
            <div style="background:rgba(0,212,255,0.1)"></div>
            <div style="text-align:center;padding:4px 0">
              <div style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:${realisedPnl>=0?'var(--green)':'var(--red)'}" id="dashPnlRealised">${realisedPnl>=0?'+':''}${fmtAUD(realisedPnl)}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:3px">Realised</div>
            </div>
            <div style="background:rgba(0,212,255,0.1)"></div>
            <div style="text-align:center;padding:4px 0">
              <div style="font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;color:${unrealisedPnl>=0?'var(--green)':'var(--red)'}" id="dashPnlUnreal">${unrealisedPnl>=0?'+':''}${fmtAUD(unrealisedPnl)}</div>
              <div style="font-family:'Space Grotesk',sans-serif;font-size:9px;font-weight:700;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-top:3px">Unrealised</div>
            </div>
          </div>

          <!-- P&L Breakdown (hidden by default) -->
          <div id="pnlBreakdown" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid rgba(0,212,255,0.08)">
            ${pnlAssets.length ? pnlAssets.map(a => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;align-items:center;gap:10px">
                  <div style="width:28px;height:28px;border-radius:50%;background:${COLORS[a.sym]||'#1A1A1A'}22;color:${COLORS[a.sym]||'#888'};display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">${ICONS[a.sym]||a.sym[0]}</div>
                  <div>
                    <div style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700">${a.sym}</div>
                    <div style="font-size:10px;color:var(--grey2)">Avg buy: ${fmtAUD(a.avgBuyPrice)}</div>
                  </div>
                </div>
                <div style="text-align:right">
                  <div style="font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:${a.unrealisedPnl>=0?'var(--green)':'var(--red)'}">${a.unrealisedPnl>=0?'+':''}${fmtAUD(a.unrealisedPnl)}</div>
                  <div style="font-size:10px;font-weight:600;color:${a.pnlPct>=0?'var(--green)':'var(--red)'}">${a.pnlPct>=0?'▲':'▼'} ${Math.abs(a.pnlPct).toFixed(1)}%</div>
                </div>
              </div>`).join('')
            : '<div style="font-size:12px;color:var(--grey2);padding:6px 0">Trades will be tracked from now on</div>'}
          </div>` : `
          <div style="font-size:12px;color:var(--grey2);font-family:\'Space Grotesk\',sans-serif">
            ${serverOnline ? 'No trades tracked yet — P&L builds as you trade' : 'Connect server to see P&L'}
          </div>`}
        </div>
      </div>
    </div>

    <!-- Holdings Mini Strip -->
    ${holdingRows.filter(h => !h.isCash && h.val > 1).length > 0 ? `
    <div style="padding:14px 18px 0">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--grey2);text-transform:uppercase;margin-bottom:8px">Holdings</div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px" id="holdingsStrip">
        ${holdingRows.filter(h => !h.isCash && h.val > 1).map(h => `
          <div onclick="selectCoin('${Object.keys(DISPLAY).find(k=>k.includes(h.s==='BTC'?'XBT':h.s))||''}')"
            style="flex-shrink:0;background:rgba(0,212,255,0.05);border:1px solid ${h.chg>=0?'rgba(0,200,150,0.2)':'rgba(255,68,102,0.15)'};border-radius:12px;padding:10px 14px;cursor:pointer;min-width:90px;transition:all 0.15s">
            <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:${COLORS[h.s]||'#888'};margin-bottom:5px">${h.s}</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:700;color:var(--white)">${fmtAUD(h.val)}</div>
            <div style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;margin-top:2px;color:${h.chg>=0?'var(--green)':'var(--red)'}">
              ${h.chg>=0?'▲':'▼'} ${Math.abs(h.chg).toFixed(1)}%
            </div>
          </div>`).join('')}
      </div>
    </div>` : ''}

    <!-- Coin Selector + Chart -->
    <div style="padding:14px 18px 0">
      <div style="font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.14em;color:var(--grey2);text-transform:uppercase;margin-bottom:8px">Markets</div>
    </div>
    <div class="coin-rail" id="coinRail">
      ${PAIRS.map(pair => {
        const pd = prices[pair] || {};
        const c  = parseFloat(pd.change24h || 0);
        return `<button class="coin-tab ${pair===selectedPair?'active':''}" onclick="selectCoin('${pair}')">
          ${sym(pair)}&nbsp;<span style="font-size:10px;opacity:0.6">${c>=0?'+':''}${c.toFixed(1)}%</span>
        </button>`;
      }).join('')}
    </div>

    <!-- Selected Coin Price + Chart -->
    <div style="padding:12px 18px 0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div>
          <div style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.02em;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.8));-webkit-background-clip:text;-webkit-text-fill-color:transparent" id="heroPrice">${fmtAUD(p.price)}</div>
          <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;margin-top:2px" class="${chg>=0?'up':'down'}" id="heroChg">${chg>=0?'▲':'▼'} ${Math.abs(chg).toFixed(2)}% · ${DISPLAY[selectedPair]||selectedPair}</div>
        </div>
        <div style="display:flex;gap:4px">
          ${['1M','5M','15M','1H','4H','1D'].map(tf=>`<button class="tf ${tf===chartTF?'active':''}" onclick="changeTF('${tf}')">${tf}</button>`).join('')}
        </div>
      </div>
      <canvas id="mainChart" style="height:90px"></canvas>
    </div>

    <!-- AI Signal -->
    <div style="padding:10px 18px 0">
      <div class="signal-strip">
        <div class="signal-strip-inner">
          <div class="signal-action-block ${sig?sig.action.toLowerCase():'hold'}" id="sigBlock">

  return PAIRS.map(pair => {

    const col  = COLORS[s] || '#888';

  try {

        html += `<div class="signal-suggestion">💰 ${fmtAUD(sig.suggestedAmountAUD)} suggested (${sig.suggestedPct}% of balance)</div>`;

// ── Chart Engine v4.0 — Candlestick + Overlays ────────────────
let chartOHLC    = []; // cached raw candles
let chartOverlay = {}; // { avgBuyPrice, stopLossPrice, trades }
let liveChartTimer = null;

async function drawChart(canvasId, pair, opts = {}) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth;
  const H   = opts.height || 140;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.scale(dpr, dpr); canvas.style.height = H + 'px';

  // Fetch candles
  let candles = [];
  try {
    const data = await api(`/api/ohlc?pair=${pair}&interval=${tfInt(chartTF)}`);
    candles = data.data || [];
    chartOHLC = candles;
  } catch(e) {
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.font = '11px Space Grotesk';
    ctx.fillText('No data', 10, H/2);
    return;
  }

  if (!candles.length) return;

  // Use last N candles that fit the width
  const maxCandles = Math.min(Math.floor(W / 6), candles.length, 80);
  const visible    = candles.slice(-maxCandles);

  const highs  = visible.map(c => parseFloat(c[2]));
  const lows   = visible.map(c => parseFloat(c[3]));
  const mn     = Math.min(...lows)  * 0.999;
  const mx     = Math.max(...highs) * 1.001;
  const range  = mx - mn || 1;

  const padT = 12, padB = 16;
  const cH   = H - padT - padB;
  const toY  = v => padT + cH - ((v - mn) / range) * cH;
  const candW = W / visible.length;
  const bodyW = Math.max(candW * 0.6, 2);

  // Background grid lines
  ctx.strokeStyle = 'rgba(0,212,255,0.05)';
  ctx.lineWidth   = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = padT + (cH / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // Draw candles
  visible.forEach((c, i) => {
    const open  = parseFloat(c[1]);
    const high  = parseFloat(c[2]);
    const low   = parseFloat(c[3]);
    const close = parseFloat(c[4]);
    const bull  = close >= open;
    const x     = i * candW + candW / 2;
    const col   = bull ? '#00C896' : '#FF4466';
    const alpha = bull ? '0.85' : '0.85';

    // Wick
    ctx.beginPath();
    ctx.strokeStyle = col;
    ctx.lineWidth   = 1;
    ctx.moveTo(x, toY(high));
    ctx.lineTo(x, toY(low));
    ctx.stroke();

    // Body
    const bodyTop = toY(Math.max(open, close));
    const bodyBot = toY(Math.min(open, close));
    const bH      = Math.max(bodyBot - bodyTop, 1);
    ctx.fillStyle = col;
    ctx.globalAlpha = parseFloat(alpha);
    ctx.fillRect(x - bodyW/2, bodyTop, bodyW, bH);
    ctx.globalAlpha = 1;
  });

  // Volume bars at bottom
  const volumes = visible.map(c => parseFloat(c[6]));
  const maxVol  = Math.max(...volumes) || 1;
  const volH    = Math.min(cH * 0.15, 20);
  volumes.forEach((v, i) => {
    const c    = visible[i];
    const bull = parseFloat(c[4]) >= parseFloat(c[1]);
    const x    = i * candW;
    const bh   = (v / maxVol) * volH;
    ctx.fillStyle   = bull ? 'rgba(0,200,150,0.3)' : 'rgba(255,68,102,0.3)';
    ctx.fillRect(x, H - padB - bh, Math.max(candW - 1, 1), bh);
  });

  // Overlay lines from P&L data
  const sym = (DISPLAY[pair]||pair).replace('/AUD','');
  const assetPnl = pnlData?.assetSummary?.find(a => a.sym === sym);
  if (assetPnl?.avgBuyPrice) {
    const avgY = toY(assetPnl.avgBuyPrice);
    if (avgY > padT && avgY < H - padB) {
      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(0,212,255,0.7)';
      ctx.lineWidth   = 1.5;
      ctx.moveTo(0, avgY); ctx.lineTo(W, avgY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(0,212,255,0.9)';
      ctx.font      = 'bold 9px Space Grotesk';
      ctx.fillText(`AVG BUY ${fmtAUDCompact(assetPnl.avgBuyPrice)}`, 4, avgY - 3);
    }
  }

  // Stop-loss line
  if (botCfg.stopLossEnabled && assetPnl?.avgBuyPrice) {
    const slPrice = assetPnl.avgBuyPrice * (1 - botCfg.stopLossPct / 100);
    const slY     = toY(slPrice);
    if (slY > padT && slY < H - padB) {
      ctx.beginPath();
      ctx.setLineDash([3, 5]);
      ctx.strokeStyle = 'rgba(255,68,102,0.6)';
      ctx.lineWidth   = 1;
      ctx.moveTo(0, slY); ctx.lineTo(W, slY); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,68,102,0.8)';
      ctx.font      = 'bold 9px Space Grotesk';
      ctx.fillText(`SL ${fmtAUDCompact(slPrice)}`, 4, slY - 3);
    }
  }

  // Trade history dots
  if (pnlData?.recentTrades) {
    const pairTrades = pnlData.recentTrades
      .filter(t => t.pair === pair)
      .slice(-10);
    pairTrades.forEach(t => {
      const tPrice = t.price;
      if (!tPrice) return;
      const ty = toY(tPrice);
      if (ty < padT || ty > H - padB) return;
      // Find approximate x position based on timestamp
      const tradeTime = new Date(t.timestamp).getTime() / 1000;
      const firstTime = parseFloat(visible[0][0]);
      const lastTime  = parseFloat(visible[visible.length-1][0]);
      const timeRange = lastTime - firstTime || 1;
      const tx = ((tradeTime - firstTime) / timeRange) * W;
      if (tx < 0 || tx > W) return;
      ctx.beginPath();
      ctx.arc(tx, ty, 4, 0, Math.PI * 2);
      ctx.fillStyle   = t.type === 'buy' ? '#00C896' : '#FF4466';
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth   = 1;
      ctx.stroke();
    });
  }

  // Price label top right
  const lastClose = parseFloat(visible[visible.length-1][4]);
  const prevClose = parseFloat(visible[visible.length-2]?.[4] || visible[visible.length-1][1]);
  const rising    = lastClose >= prevClose;
  const ly        = toY(lastClose);
  ctx.beginPath();
  ctx.setLineDash([2,4]);
  ctx.strokeStyle = 'rgba(0,212,255,0.25)';
  ctx.lineWidth   = 1;
  ctx.moveTo(0, ly); ctx.lineTo(W, ly); ctx.stroke();
  ctx.setLineDash([]);
}

function tfInt(tf) {
  return { '1M':1,'5M':5,'15M':15,'1H':60,'4H':240,'1D':1440 }[tf] || 60;
}

  const amt=parseFloat(document.getElementById('tradeAmt')?.value)||0;

async function loadPerformanceChart() {
  const el = document.getElementById('perfChartWrap');
  if (!el) return;
  if (!serverOnline || !cfg.botToken) { el.innerHTML = `<div style="color:var(--grey2);font-size:12px">Connect server to see performance</div>`; return; }
  try {
    const res  = await api('/api/portfolio/history');
    const hist = res.data || [];
    if (hist.length < 2) {
      el.innerHTML = `<div style="color:var(--grey2);font-size:12px;font-family:'Space Grotesk',sans-serif">Performance data builds up over time — check back tomorrow!</div>`;
      return;
    }
    // Draw chart
    const canvas = document.createElement('canvas');
    canvas.style.height = '100px';
    el.innerHTML = '';
    el.appendChild(canvas);

    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio||1;
    const W   = el.offsetWidth; const H = 100;
    canvas.width = W*dpr; canvas.height = H*dpr;
    ctx.scale(dpr,dpr); canvas.style.height=H+'px';

    const vals = hist.map(h => h.valueAUD);
    const min  = Math.min(...vals); const max = Math.max(...vals); const range = max-min||1;
    const toY  = v => H - ((v-min)/range)*(H-20) - 10;
    const toX  = i => (i/(vals.length-1))*W;

    const rising = vals[vals.length-1] >= vals[0];
    const col    = rising ? '#00D4FF' : '#FF4466';
    const grd    = ctx.createLinearGradient(0,0,0,H);
    grd.addColorStop(0, rising?'rgba(0,212,255,0.2)':'rgba(255,68,102,0.2)');
    grd.addColorStop(1,'rgba(0,0,0,0)');

    ctx.beginPath(); ctx.moveTo(toX(0),toY(vals[0]));
    for(let i=1;i<vals.length;i++) ctx.lineTo(toX(i),toY(vals[i]));
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.stroke();
    ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
    ctx.fillStyle=grd; ctx.fill();

    // Labels
    const first = vals[0], last = vals[vals.length-1];
    const pct   = (((last-first)/first)*100).toFixed(1);
    const label = document.createElement('div');
    label.style.cssText = `display:flex;justify-content:space-between;margin-top:8px;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:600;color:var(--grey2)`;
    label.innerHTML = `<span>${hist[0].date}</span><span style="color:${parseFloat(pct)>=0?'var(--green)':'var(--red)'}">${parseFloat(pct)>=0?'+':''}${pct}% since start</span>`;
    el.appendChild(label);
  } catch(e) { el.innerHTML = `<div style="color:var(--grey2);font-size:12px">Chart unavailable</div>`; }
}

async function createAlert() {

  } catch(e){ showToast('Error: '+e.message); }

async function deleteAlert(id) {

  try {
    const res  = await api('/api/backtest', { method:'POST', body:JSON.stringify({ pair, days }) });
    const d    = res.data;
    const col  = d.totalReturn >= 0 ? 'var(--green)' : 'var(--red)';
    if (result) result.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.1);border-radius:10px;padding:10px;text-align:center">

          <div style="font-size:9px;color:var(--grey2);margin-top:3px;letter-spacing:0.1em;text-transform:uppercase">Win Rate</div>
        </div>
        <div style="background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.1);border-radius:10px;padding:10px;text-align:center">
          <div style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700">${d.totalTrades}</div>
          <div style="font-size:9px;color:var(--grey2);margin-top:3px;letter-spacing:0.1em;text-transform:uppercase">Trades</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--grey2);font-family:'Space Grotesk',sans-serif;line-height:1.6">
        ${d.wins} wins · ${d.losses} losses · Avg P&L per trade: ${d.avgPnlPct>=0?'+':''}${d.avgPnlPct}%<br>
        Analysis period: ${days} days · ${d.candleCount} candles analysed

      </div>
      ${d.winRate < 50 ? `<div style="margin-top:8px;padding:8px;background:rgba(255,184,0,0.06);border:1px solid rgba(255,184,0,0.2);border-radius:8px;font-size:11px;color:var(--yellow);font-family:'Space Grotesk',sans-serif">⚠️ Win rate below 50% — consider adjusting confidence threshold in bot settings</div>` : ''}

  } catch(e) {

            ${Object.entries(botLastSignals).map(([pair,sig])=>`
              <div style="padding:8px 0;border-bottom:1px solid var(--border)">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
                  <span style="font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;color:var(--white)">${sym(pair)}</span>
                  <span style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:700;color:${sig.action==='SELL'?'var(--red)':sig.action==='BUY'?'var(--green)':'var(--grey2)'}">
                    ${sig.action} ${sig.confidence}%
                  </span>
                </div>
                ${sig.timeframes ? `
                <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">
                  ${Object.entries(sig.timeframes).map(([tf,d])=>`
                    <span style="background:var(--s3);border:1px solid var(--border);padding:2px 7px;border-radius:3px;font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;color:var(--grey1)">
                      ${tf} · RSI ${d.rsi} · ${d.macd==='BULLISH'?'<span style="color:var(--green)">▲</span>':'<span style="color:var(--red)">▼</span>'} · BB ${d.bb.replace('_',' ')}
                    </span>`).join('')}
                </div>` : ''}
                ${sig.pnl ? `<div style="font-size:11px;font-family:'Space Grotesk',sans-serif;font-weight:600;color:${parseFloat(sig.pnl.aud)>=0?'var(--green)':'var(--red)'}">
                  P&L: ${parseFloat(sig.pnl.aud)>=0?'+':''}${fmtAUD(Math.abs(parseFloat(sig.pnl.aud)))} (${sig.pnl.pct}%)
                </div>` : ''}
              </div>`).join('')}
          </div>` : ''}`;
    }
  } catch(e){
    if(badge){ badge.textContent='ERROR'; badge.className='running-badge off'; }
    if(activity) activity.innerHTML=`<div style="color:var(--grey2);font-size:12px">Error: ${e.message}</div>`;
  }
}

async function startBot() {
  if(!serverOnline){ showToast('Server offline'); return; }
  try { showToast('Starting bot...'); await api('/api/bot/start',{method:'POST'}); botActive=true; showToast('Bot started — check Telegram'); await loadBotStatus(); }
  catch(e){ showToast('Error: '+e.message); }
}
async function stopBot() {
  if(!serverOnline){ showToast('Server offline'); return; }
  try { await api('/api/bot/stop',{method:'POST'}); botActive=false; showToast('Bot stopped'); await loadBotStatus(); }
  catch(e){ showToast('Error: '+e.message); }
}
function toggleStopLoss() {
  botCfg.stopLossEnabled = !(botCfg.stopLossEnabled !== false);
  const btn = document.getElementById('stopLossToggle');
  if (btn) { btn.textContent = botCfg.stopLossEnabled ? '● ON' : '● OFF'; btn.className = `btn ${botCfg.stopLossEnabled ? 'btn-sell' : 'btn-ghost'}`; btn.style.cssText = 'width:auto;padding:6px 12px;font-size:11px'; }
}

function toggleTrailing() {
  botCfg.trailingStop = !botCfg.trailingStop;
  const btn = document.getElementById('trailingToggle');
  if (btn) { btn.textContent = botCfg.trailingStop ? '● ON' : '● OFF'; btn.className = `btn ${botCfg.trailingStop ? 'btn-cyan' : 'btn-ghost'}`; btn.style.cssText = 'width:auto;padding:6px 12px;font-size:11px'; }
}

async function saveBotConfig() {
  botCfg.confidenceMin      = parseInt(document.getElementById('botConfMin')?.value)||75;
  botCfg.riskLevel          = document.getElementById('botRisk')?.value||'conservative';
  botCfg.minHoldingValueAUD = parseInt(document.getElementById('botMinHolding')?.value)||50;
  botCfg.stopLossPct        = parseFloat(document.getElementById('stopLossPct')?.value)||8;
  botCfg.minHoldMinutes     = parseInt(document.getElementById('botMinHold')?.value)||60;
  if(!serverOnline){ showToast('Server offline'); return; }
  try {
    await api('/api/bot/config',{method:'POST',body:JSON.stringify(botCfg)});
    await api('/api/stoploss',{method:'POST',body:JSON.stringify({ enabled:botCfg.stopLossEnabled!==false, dropPct:botCfg.stopLossPct, trailing:botCfg.trailingStop })});
    showToast('Bot settings saved ✅');
  }
  catch(e){ showToast('Error: '+e.message); }
}

// ── DCA Functions ─────────────────────────────────────────────
function setDCAFreq(freq) {
  dcaCfg.frequency = freq;
  document.querySelectorAll('.interval-pill').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase()===freq));
}
function toggleDCA() {
  dcaCfg.enabled = !dcaCfg.enabled;
  const btn = document.getElementById('dcaToggle');
  if (btn) { btn.textContent = dcaCfg.enabled ? '● ON' : '● OFF'; btn.className = `btn ${dcaCfg.enabled ? 'btn-buy' : 'btn-ghost'}`; btn.style.cssText = 'width:auto;padding:6px 12px;font-size:11px'; }
}
async function saveDCAConfig() {
  dcaCfg.amountAUD = parseFloat(document.getElementById('dcaAmount')?.value)||50;
  const pair = document.getElementById('dcaPair')?.value;
  if (pair) dcaCfg.pairs = [pair];
  if (!serverOnline) { showToast('Server offline'); return; }
  try {
    await api('/api/dca/config',{method:'POST',body:JSON.stringify({...dcaCfg})});
    showToast('DCA settings saved ✅');
  } catch(e){ showToast('Error: '+e.message); }
}
async function runDCANow() {
  if (!serverOnline) { showToast('Server offline'); return; }
  try { showToast('Running DCA — check Telegram!'); await api('/api/dca/run',{method:'POST'}); }
  catch(e){ showToast('Error: '+e.message); }
}
async function loadDCAConfig() {
  if (!serverOnline || !cfg.botToken) return;
  try { const res = await api('/api/dca/config'); if (res.data) Object.assign(dcaCfg, res.data); } catch(e) {}
}

// ── Settings Tab ──────────────────────────────────────────────
function renderSettings() {
  document.getElementById('mainContent').innerHTML = `<div class="fade-in">
    <div style="padding:20px 20px 0">
      <div class="field-label">Server URL</div>
      <input class="input" id="inputUrl" type="url" placeholder="https://your-server.railway.app" value="${cfg.serverUrl}">
      <div class="field-label">Bot Secret Token</div>
      <input class="input" id="inputToken" type="password" placeholder="Your BOT_SECRET_TOKEN" value="${cfg.botToken}">
      <button class="btn btn-cyan" onclick="saveServerConfig()">Save & Test Connection</button>
    </div>

    <div class="section-label">System Status</div>
    <div class="card"><div class="card-body" style="font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;line-height:2.4;letter-spacing:0.02em">
      <div style="display:flex;justify-content:space-between">
        <span style="color:var(--grey2)">Server</span>
        <span style="color:${serverOnline?'var(--green)':'var(--red)'}">${serverOnline?'● Online':'● Offline'}</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
        <span style="color:var(--grey2)">Currency</span>
        <span>🇦🇺 AUD</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
        <span style="color:var(--grey2)">Advisor</span>
        <span style="color:${advisorCfg.enabled?'var(--green)':'var(--grey2)'}">${advisorCfg.enabled?'● Active':'● Paused'} — every ${advisorCfg.intervalHours}h</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
        <span style="color:var(--grey2)">AUD Cash</span>
        <span style="color:var(--green)">${fmtAUD(getAUDCash())}</span>
      </div>
      <div style="display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:6px;margin-top:2px">
        <span style="color:var(--grey2)">Version</span>
        <span style="color:var(--grey2)">KRAKN·AI v4.0</span>
      </div>
    </div></div>

    <div class="card" style="margin-top:8px"><div class="card-body" style="font-size:11px;color:var(--grey2);line-height:1.7">
      ⚠️ Not financial advice. Cryptocurrency trading involves substantial risk. Only trade what you can afford to lose.
    </div></div>
    <div class="spacer"></div>
  </div>`;
}

async function saveServerConfig() {
  cfg.serverUrl=document.getElementById('inputUrl')?.value?.trim().replace(/\/$/,'')||'';
  cfg.botToken =document.getElementById('inputToken')?.value?.trim()||'';
  localStorage.setItem('serverUrl',cfg.serverUrl);
  localStorage.setItem('botToken', cfg.botToken);
  showToast('Testing connection...');
  await checkServer();
  showToast(serverOnline?'Connected!':'Could not reach server');
}

// ── Tab Switcher ──────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');
  document.getElementById('mainContent').innerHTML = '';
  if      (tab==='dashboard') renderDashboard();
  else if (tab==='trade')     renderTrade();
  else if (tab==='portfolio') renderPortfolio();
  else if (tab==='alerts')    renderAlerts();
  else if (tab==='bot')       renderBot();
  else if (tab==='settings')  renderSettings();
}

function showToast(msg, dur=3000) {
  document.querySelector('.toast')?.remove();
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), dur);
}

// ── Init ──────────────────────────────────────────────────────
async function init() {
  await checkServer();
  await refreshPrices();
  await refreshBalance();
  await refreshOrders();
  await refreshAlerts();
  await refreshPnL();
  // Load persisted settings from server on startup
  // This is what fixes risk level resetting — we pull from Railway volume not defaults
  if (serverOnline && cfg.botToken) {
    try {
      const [botRes, advRes, dcaRes] = await Promise.all([
        api('/api/bot/config'),
        api('/api/advisor/settings'),
        api('/api/dca/config'),
      ]);
      if (botRes?.data) {
        const c = botRes.data;
        if (c.riskLevel)             botCfg.riskLevel          = c.riskLevel;
        if (c.confidenceMin)         botCfg.confidenceMin      = c.confidenceMin;
        if (c.minHoldingValueAUD)    botCfg.minHoldingValueAUD = c.minHoldingValueAUD;
        if (c.stopLossPct)           botCfg.stopLossPct        = c.stopLossPct;
        if (c.stopLossEnabled !== undefined) botCfg.stopLossEnabled = c.stopLossEnabled;
        if (c.trailingStop !== undefined)    botCfg.trailingStop    = c.trailingStop;
        botActive = c.state?.running || false;
        console.log('Bot config loaded from server: risk=' + botCfg.riskLevel + ' confidence=' + botCfg.confidenceMin + '%');
      }
      if (advRes?.data) Object.assign(advisorCfg, advRes.data);
      if (dcaRes?.data) Object.assign(dcaCfg, dcaRes.data);
      try { const ar = await api('/api/allocation'); if (ar.data) targetAllocation = ar.data; } catch(e) {}
    } catch(e) { console.warn('Could not load settings from server:', e.message); }
  }
  renderDashboard();
  window.setInterval(refreshPrices, 30000);
  window.setInterval(checkServer,   60000);
  window.setInterval(async()=>{ await refreshBalance(); await refreshOrders(); await refreshAlerts(); }, 15000);
  window.setInterval(refreshPnL, 120000);
}

init();
</script>
