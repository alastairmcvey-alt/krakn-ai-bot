<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KRAKN·AI</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --void:    #050810;
  --deep:    #080d1a;
  --surface: #0b1628;
  --lift:    #111f35;
  --border:  rgba(0,200,255,0.10);
  --cyan:    #00C8FF;
  --green:   #00E5A0;
  --red:     #FF3D6B;
  --amber:   #F5A623;
  --muted:   #4a6080;
  --text:    #d8e8f5;
  --dim:     #6a8aaa;
  --font-data: 'JetBrains Mono', monospace;
  --font-display: 'Syne', sans-serif;
  --font-body: 'Inter', sans-serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; background:var(--void); color:var(--text); font-family:var(--font-body); }

/* ─── Layout ─── */
#app { display:flex; flex-direction:column; height:100vh; max-width:430px; margin:0 auto; position:relative; }
.header { padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between; position:relative; z-index:10; border-bottom:1px solid var(--border); }
.logo { font-family:var(--font-display); font-size:20px; letter-spacing:0.04em; color:#fff; display:flex; align-items:center; gap:6px; }
.logo-dot { width:8px; height:8px; background:var(--cyan); border-radius:50%; animation:breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.7)} }
.status-pill { display:flex; align-items:center; gap:5px; padding:4px 10px; background:var(--surface); border:1px solid var(--border); border-radius:20px; font-family:var(--font-data); font-size:10px; color:var(--dim); letter-spacing:0.06em; cursor:pointer; }
.status-dot { width:6px; height:6px; border-radius:50%; background:var(--muted); }
.status-dot.online { background:var(--green); box-shadow:0 0 6px var(--green); }
.status-dot.offline { background:var(--red); }

.content { flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; }
.content::-webkit-scrollbar { display:none; }

/* ─── Bottom Nav ─── */
.nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; background:rgba(5,8,16,0.96); backdrop-filter:blur(20px); border-top:1px solid var(--border); display:flex; padding:8px 0 max(8px, env(safe-area-inset-bottom)); z-index:100; }
.nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 0; background:none; border:none; color:var(--muted); cursor:pointer; transition:color 0.2s; }
.nav-btn.active { color:var(--cyan); }
.nav-icon { font-size:18px; line-height:1; }
.nav-label { font-size:9px; font-family:var(--font-data); letter-spacing:0.08em; text-transform:uppercase; }

/* ─── Cards ─── */
.card { background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
.section-label { font-family:var(--font-data); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }

/* ─── Markets Tab ─── */
.markets-header { padding:16px 20px 0; }
.coin-rail { display:flex; gap:8px; overflow-x:auto; padding:12px 20px; -webkit-overflow-scrolling:touch; }
.coin-rail::-webkit-scrollbar { display:none; }
.coin-chip { flex-shrink:0; padding:7px 14px; background:var(--surface); border:1px solid var(--border); border-radius:20px; font-family:var(--font-data); font-size:12px; color:var(--dim); cursor:pointer; transition:all 0.2s; white-space:nowrap; }
.coin-chip.active { background:rgba(0,200,255,0.12); border-color:rgba(0,200,255,0.4); color:var(--cyan); }
.coin-chip .chg { font-size:10px; }
.coin-chip .chg.up { color:var(--green); }
.coin-chip .chg.down { color:var(--red); }

/* ─── Signal Arc (signature element) ─── */
.signal-block { padding:0 20px 16px; }
.signal-arc-wrap { position:relative; width:100%; display:flex; flex-direction:column; align-items:center; padding:24px 0 16px; background:var(--surface); border:1px solid var(--border); border-radius:16px; margin-bottom:12px; }
.arc-svg { width:160px; height:90px; }
.arc-track { fill:none; stroke:rgba(255,255,255,0.05); stroke-width:8; stroke-linecap:round; }
.arc-fill { fill:none; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1), stroke 0.5s; }
.arc-center { position:absolute; top:24px; left:50%; transform:translateX(-50%); text-align:center; }
.arc-action { font-family:var(--font-display); font-size:28px; font-weight:800; line-height:1; }
.arc-action.BUY { color:var(--green); }
.arc-action.SELL { color:var(--red); }
.arc-action.HOLD { color:var(--amber); }
.arc-conf { font-family:var(--font-data); font-size:12px; color:var(--dim); margin-top:3px; }
.signal-meta { display:flex; justify-content:space-between; padding:0 16px; width:100%; margin-top:8px; }
.signal-stat { text-align:center; }
.signal-stat-val { font-family:var(--font-data); font-size:13px; color:var(--text); }
.signal-stat-key { font-size:10px; color:var(--muted); margin-top:2px; }
.signal-reason { font-size:12px; color:var(--dim); text-align:center; padding:10px 20px 0; line-height:1.5; }

/* ─── Price display ─── */
.price-block { padding:0 20px; margin-bottom:12px; }
.price-main { font-family:var(--font-data); font-size:36px; font-weight:600; color:#fff; letter-spacing:-0.02em; line-height:1; }
.price-change { font-family:var(--font-data); font-size:13px; margin-top:4px; }
.price-change.up { color:var(--green); }
.price-change.down { color:var(--red); }

/* ─── Chart ─── */
.chart-wrap { margin:0 20px 12px; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; }
.chart-toolbar { display:flex; gap:4px; padding:10px 12px 0; }
.tf-btn { font-family:var(--font-data); font-size:10px; padding:4px 8px; background:transparent; border:1px solid transparent; border-radius:6px; color:var(--muted); cursor:pointer; transition:all 0.2s; }
.tf-btn.active { background:rgba(0,200,255,0.12); border-color:rgba(0,200,255,0.3); color:var(--cyan); }
canvas { display:block; width:100% !important; }

/* ─── Action buttons ─── */
.action-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:0 20px 16px; }
.action-btn { padding:12px 8px; border:none; border-radius:12px; font-family:var(--font-data); font-size:11px; font-weight:600; letter-spacing:0.06em; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px; transition:all 0.15s; }
.action-btn:active { transform:scale(0.96); }
.action-btn.buy  { background:rgba(0,229,160,0.15); color:var(--green); border:1px solid rgba(0,229,160,0.3); }
.action-btn.sell { background:rgba(255,61,107,0.15); color:var(--red);   border:1px solid rgba(255,61,107,0.3); }
.action-btn.send { background:rgba(0,200,255,0.12); color:var(--cyan);   border:1px solid rgba(0,200,255,0.25); }

/* ─── On-chain strip ─── */
.onchain-strip { margin:0 20px 80px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
.onchain-label { font-family:var(--font-data); font-size:10px; color:var(--muted); letter-spacing:0.1em; text-transform:uppercase; }
.onchain-val { font-size:12px; color:var(--dim); }
.onchain-fetch { font-family:var(--font-data); font-size:10px; color:var(--cyan); cursor:pointer; letter-spacing:0.08em; }

/* ─── Trade Tab ─── */
.trade-wrap { padding:16px 20px 90px; }
.seg-ctrl { display:flex; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:3px; margin-bottom:16px; }
.seg-btn { flex:1; padding:8px; text-align:center; border:none; background:none; color:var(--muted); font-family:var(--font-data); font-size:12px; border-radius:9px; cursor:pointer; transition:all 0.2s; }
.seg-btn.active.buy  { background:rgba(0,229,160,0.15); color:var(--green); }
.seg-btn.active.sell { background:rgba(255,61,107,0.15); color:var(--red); }
.field-label { font-family:var(--font-data); font-size:10px; color:var(--muted); letter-spacing:0.1em; margin-bottom:6px; text-transform:uppercase; }
.inp { width:100%; background:var(--lift); border:1px solid var(--border); border-radius:10px; padding:12px 14px; color:#fff; font-family:var(--font-data); font-size:15px; margin-bottom:12px; outline:none; transition:border 0.2s; -webkit-appearance:none; }
.inp:focus { border-color:var(--cyan); }
select.inp { cursor:pointer; }
.grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.trade-submit { width:100%; padding:15px; border:none; border-radius:12px; font-family:var(--font-data); font-size:14px; font-weight:600; letter-spacing:0.06em; cursor:pointer; transition:all 0.15s; margin-top:4px; }
.trade-submit:active { transform:scale(0.98); }
.trade-submit.buy  { background:var(--green); color:#000; }
.trade-submit.sell { background:var(--red);   color:#fff; }

/* ─── Portfolio Tab ─── */
.port-wrap { padding:0 0 90px; }
.port-hero { padding:28px 20px 24px; background:linear-gradient(180deg,var(--deep) 0%,var(--void) 100%); text-align:center; border-bottom:1px solid var(--border); }
.port-total { font-family:var(--font-data); font-size:42px; font-weight:600; color:#fff; letter-spacing:-0.02em; }
.port-sub { font-size:12px; color:var(--muted); margin-top:4px; }
.port-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); margin-bottom:20px; }
.port-stat { background:var(--void); padding:14px; text-align:center; }
.port-stat-val { font-family:var(--font-data); font-size:14px; margin-bottom:3px; }
.port-stat-key { font-size:10px; color:var(--muted); }
.holdings-list { padding:0 20px; }
.holding { display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--border); }
.holding:last-child { border-bottom:none; }
.holding-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-data); font-size:14px; font-weight:600; flex-shrink:0; }
.holding-info { flex:1; }
.holding-name { font-weight:600; font-size:14px; }
.holding-qty  { font-family:var(--font-data); font-size:11px; color:var(--muted); margin-top:2px; }
.holding-right { text-align:right; }
.holding-val  { font-family:var(--font-data); font-size:14px; }
.holding-pct  { font-family:var(--font-data); font-size:11px; margin-top:2px; }
.up { color:var(--green); }
.down { color:var(--red); }

/* ─── Bot Tab ─── */
.bot-wrap { padding:16px 20px 90px; }
.bot-hero { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:14px; }
.bot-status-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.bot-title { font-family:var(--font-display); font-size:18px; font-weight:700; }
.toggle { width:50px; height:28px; background:var(--lift); border-radius:14px; position:relative; cursor:pointer; transition:background 0.3s; border:1px solid var(--border); }
.toggle.on { background:rgba(0,229,160,0.25); border-color:var(--green); }
.toggle-knob { position:absolute; top:3px; left:3px; width:20px; height:20px; background:var(--muted); border-radius:50%; transition:all 0.3s; }
.toggle.on .toggle-knob { left:25px; background:var(--green); }
.bot-meta { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.bot-meta-item { background:var(--lift); border-radius:10px; padding:10px; }
.bot-meta-val { font-family:var(--font-data); font-size:13px; color:var(--text); }
.bot-meta-key { font-size:10px; color:var(--muted); margin-top:2px; }

/* ─── Settings Tab ─── */
.settings-wrap { padding:16px 20px 90px; }
.settings-section { margin-bottom:20px; }
.settings-section-title { font-family:var(--font-data); font-size:10px; color:var(--muted); letter-spacing:0.12em; text-transform:uppercase; margin-bottom:10px; }
.settings-row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--border); }
.settings-row:last-child { border-bottom:none; }
.settings-row-label { font-size:14px; }
.settings-row-sub { font-size:11px; color:var(--muted); margin-top:2px; }
.settings-val { font-family:var(--font-data); font-size:13px; color:var(--cyan); }

/* ─── Toast ─── */
.toast { position:fixed; top:80px; left:50%; transform:translateX(-50%); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 18px; font-family:var(--font-data); font-size:12px; z-index:999; white-space:nowrap; max-width:90vw; text-align:center; animation:toastIn 0.3s ease; }
@keyframes toastIn { from{opacity:0;top:60px} to{opacity:1;top:80px} }


/* ─── Signal Cards ─── */
.signal-row-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:border-color 0.2s; }
.signal-row-card:active { border-color:rgba(0,200,255,0.3); }
.sig-badge { display:inline-block; padding:4px 10px; border-radius:6px; font-family:var(--font-data); font-size:11px; font-weight:600; border:1px solid transparent; }

/* ─── Misc ─── */
.fade-in { animation:fadeIn 0.3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.divider { height:1px; background:var(--border); margin:0 20px; }

/* ─── Trade Sheet ─── */
.trade-sheet { position:fixed; inset:0; z-index:200; }
.sheet-backdrop { position:absolute; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(4px); }
.sheet-body {
  position:absolute; bottom:0; left:50%; transform:translate(-50%,100%);
  width:100%; max-width:430px; background:var(--surface);
  border-radius:20px 20px 0 0; border-top:1px solid var(--border);
  padding:12px 20px 40px; transition:transform 0.35s cubic-bezier(0.32,0.72,0,1);
}
.sheet-handle { width:36px; height:4px; background:var(--lift); border-radius:2px; margin:0 auto 20px; }
.sheet-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo"><div class="logo-dot"></div>KRAKN·AI</div>
    <div class="status-pill" onclick="checkServer()">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusTxt">SETUP</span>
    </div>
  </div>
  <div class="content" id="content"></div>
  <nav class="nav">
    <button class="nav-btn active" id="nav-dashboard" onclick="showTab('dashboard')">
      <div class="nav-icon">◈</div><div class="nav-label">Markets</div>
    </button>
    <button class="nav-btn" id="nav-signals" onclick="showTab('signals')">
      <div class="nav-icon">⚡</div><div class="nav-label">Signals</div>
    </button>
    <button class="nav-btn" id="nav-portfolio" onclick="showTab('portfolio')">
      <div class="nav-icon">◫</div><div class="nav-label">Portfolio</div>
    </button>
    <button class="nav-btn" id="nav-bot" onclick="showTab('bot')">
      <div class="nav-icon">⟳</div><div class="nav-label">Bot</div>
    </button>
    <button class="nav-btn" id="nav-settings" onclick="showTab('settings')">
      <div class="nav-icon">◉</div><div class="nav-label">Settings</div>
    </button>
  </nav>
</div>

<script>
// ── State ──────────────────────────────────────────────────────
let currentTab = 'dashboard';
let currentPair = 'XBTAUD';
let currentTF = '1H';
let tradeMode = 'buy';
let serverOnline = false;
let prices = {}, balance = {}, botStatus = {}, botCfg = {};

const cfg = {
  serverUrl: localStorage.getItem('serverUrl') || '',
  botToken:  localStorage.getItem('botToken')  || '',
};

const PAIRS = ['XBTAUD','ETHAUD','SOLAUD','XRPAUD','ADAAUD','LTCAUD','LINKAUD'];
const DISP  = { XBTAUD:'BTC/AUD', ETHAUD:'ETH/AUD', SOLAUD:'SOL/AUD', XRPAUD:'XRP/AUD', ADAAUD:'ADA/AUD', LTCAUD:'LTC/AUD', LINKAUD:'LINK/AUD' };
const SYMS  = { XBTAUD:'BTC', ETHAUD:'ETH', SOLAUD:'SOL', XRPAUD:'XRP', ADAAUD:'ADA', LTCAUD:'LTC', LINKAUD:'LINK' };
const COLORS = { BTC:'#F7931A', ETH:'#627EEA', SOL:'#9945FF', XRP:'#346AA9', ADA:'#0D9488', LTC:'#BFBBBB', LINK:'#2A5ADA' };

// ── API ────────────────────────────────────────────────────────
async function api(path, opts={}) {
  if (!cfg.serverUrl) throw new Error('No server');
  const url = cfg.serverUrl.replace(/\/$/,'') + path;
  const headers = { 'Content-Type':'application/json' };
  if (cfg.botToken) headers['Authorization'] = 'Bearer ' + cfg.botToken;
  const res = await fetch(url, { ...opts, headers: { ...headers, ...(opts.headers||{}) } });
  if (!res.ok) { const e = await res.json().catch(()=>({error:res.statusText})); throw new Error(e.error||res.statusText); }
  return res.json();
}

async function checkServer() {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusTxt');
  try {
    const d = await api('/health');
    serverOnline = true;
    dot.className = 'status-dot online';
    txt.textContent = d.keysConfigured ? 'LIVE' : 'NO KEYS';
  } catch {
    serverOnline = false;
    dot.className = 'status-dot offline';
    txt.textContent = cfg.serverUrl ? 'OFFLINE' : 'SETUP';
  }
}

async function refreshPrices() {
  try {
    if (cfg.serverUrl && serverOnline) {
      const r = await api('/api/ticker?pairs=' + PAIRS.join(','));
      prices = r.data || {};
    } else {
      const r = await fetch('https://api.kraken.com/0/public/Ticker?pair=' + PAIRS.join(','));
      const j = await r.json();
      for (const [k,v] of Object.entries(j.result||{})) {
        prices[k] = { price:parseFloat(v.c[0]), change24h:+((parseFloat(v.c[0])-parseFloat(v.o))/parseFloat(v.o)*100).toFixed(2) };
      }
    }
    if (currentTab==='dashboard') renderDashboard();
  } catch {}
}

async function refreshBalance() {
  if (!serverOnline||!cfg.botToken) return;
  try { balance = (await api('/api/balance')).data||{}; } catch {}
}

// ── Tabs ───────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-'+tab)?.classList.add('active');
  const c = document.getElementById('content');
  c.innerHTML = '';
  if (tab==='dashboard') renderDashboard();
  else if (tab==='signals')   renderSignals();
  else if (tab==='portfolio') renderPortfolio();
  else if (tab==='bot')       renderBot();
  else if (tab==='settings')  renderSettings();
}

// ── Dashboard ──────────────────────────────────────────────────
function renderDashboard() {
  const d = document.getElementById('content');
  const p = getPair(currentPair);
  const sym = SYMS[currentPair]||'BTC';

  // Build coin chips
  const chips = PAIRS.map(pair => {
    const pd = getPair(pair);
    const up = (pd?.change24h||0) >= 0;
    return `<div class="coin-chip ${pair===currentPair?'active':''}" onclick="selectPair('${pair}')">
      ${SYMS[pair]||pair} <span class="chg ${up?'up':'down'}">${up?'+':''}${pd?.change24h||0}%</span>
    </div>`;
  }).join('');

  d.innerHTML = `<div class="fade-in">
    <div class="coin-rail">${chips}</div>

    <div class="price-block">
      <div class="price-main">${fmtPrice(p?.price||0, currentPair)}</div>
      <div class="price-change ${(p?.change24h||0)>=0?'up':'down'}">${(p?.change24h||0)>=0?'▲':'▼'} ${Math.abs(p?.change24h||0)}% today</div>
    </div>

    <div class="chart-wrap">
      <div class="chart-toolbar">
        ${['1M','5M','15M','1H','4H','1D'].map(tf=>`<button class="tf-btn ${tf===currentTF?'active':''}" onclick="selectTF('${tf}')">${tf}</button>`).join('')}
      </div>
      <canvas id="mainChart" height="140"></canvas>
    </div>

    <div class="signal-block">
      <div class="signal-arc-wrap" id="signalArc">
        <svg class="arc-svg" viewBox="0 0 160 90">
          <path class="arc-track" d="M 20 85 A 60 60 0 0 1 140 85"/>
          <path class="arc-fill" id="arcFill" d="M 20 85 A 60 60 0 0 1 140 85" stroke="var(--amber)"
            stroke-dasharray="188" stroke-dashoffset="188"/>
        </svg>
        <div class="arc-center" onclick="loadSignal(currentPair)" style="cursor:pointer" title="Tap to refresh">
          <div class="arc-action HOLD" id="arcAction">--</div>
          <div class="arc-conf" id="arcConf">--%</div>
        </div>
        <div class="signal-meta">
          <div class="signal-stat">
            <div class="signal-stat-val" id="sigRsi">--</div>
            <div class="signal-stat-key">RSI</div>
          </div>
          <div class="signal-stat">
            <div class="signal-stat-val" id="sigScore">--</div>
            <div class="signal-stat-key">SCORE</div>
          </div>
          <div class="signal-stat">
            <div class="signal-stat-val" id="sigRegime">--</div>
            <div class="signal-stat-key">REGIME</div>
          </div>
        </div>
        <div class="signal-reason" id="sigReason" onclick="loadSignal(currentPair)" style="cursor:pointer">Tap to load AI signal</div>
      </div>
    </div>

    <div class="action-row">
      <button class="action-btn buy" onclick="quickBuy()">▲ Buy ${sym}</button>
      <button class="action-btn sell" onclick="quickSell()">▼ Sell ${sym}</button>

  if (p >= 1)    return sym + parseFloat(p).toFixed(2);
  return sym + parseFloat(p).toFixed(4);

async function loadSignal(pair) {
  const el = document.getElementById('sigReason');
  if (el) el.textContent = 'Fetching signal...';
  if (!serverOnline || !cfg.botToken) {
    updateArc({ action:'HOLD', confidence:0, rsi:'--', weightedScore:0, regime:'--', signals:[] });
    if (el) el.textContent = 'Connect server in Settings for AI signals';
    return;
  }
  try {
    const r = await api(`/api/signal/${pair}`);
    if (r?.data) updateArc(r.data);
  } catch(e) {
    if (el) el.textContent = 'Tap here to refresh signal';
  }
}

function updateArc(s) {
  const action = s?.action || 'HOLD';
  const conf   = s?.confidence || 0;
  const rsi    = s?.rsi || '--';
  const score  = s?.weightedScore?.toFixed?.(1) || '--';
  const regime = s?.regime || '--';
  const reason = s?.signals?.[0] || 'No dominant signal';

  // Colour by action
  const col = action==='BUY' ? 'var(--green)' : action==='SELL' ? 'var(--red)' : 'var(--amber)';

  // Arc math: semicircle circumference = π × r = π × 60 ≈ 188
  const circ  = 188;
  const offset = circ - (conf / 100) * circ;

  const fill = document.getElementById('arcFill');
  const act  = document.getElementById('arcAction');
  const confEl = document.getElementById('arcConf');

  if (fill) { fill.style.stroke = col; fill.style.strokeDashoffset = offset; }
  if (act)  { act.textContent = action; act.className = `arc-action ${action}`; }
  if (confEl) confEl.textContent = conf + '%';

  const rsiEl = document.getElementById('sigRsi');
  const scoreEl = document.getElementById('sigScore');
  const regimeEl = document.getElementById('sigRegime');
  const reasonEl = document.getElementById('sigReason');
  if (rsiEl) rsiEl.textContent = rsi;
  if (scoreEl) scoreEl.textContent = score;
  if (regimeEl) { regimeEl.textContent = regime; regimeEl.style.color = regime==='BULL'?'var(--green)':regime==='BEAR'?'var(--red)':'var(--amber)'; }
  if (reasonEl) reasonEl.textContent = reason;
}

// ── Chart ──────────────────────────────────────────────────────
async function drawChart(id, pair, interval=60) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  let candles = [];
  try {
    const map = { 1:1,5:5,15:15,60:60,240:240,1440:1440 };
    const r = await fetch(`https://api.kraken.com/0/public/OHLC?pair=${pair}&interval=${interval}`);
    const j = await r.json();
    const key = Object.keys(j.result||{}).find(k=>k!=='last');
    candles = j.result?.[key]?.slice(-80) || [];
  } catch {}

  const dpr = window.devicePixelRatio||1;
  const W   = canvas.parentElement.offsetWidth;
  const H   = 140;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  if (!candles.length) {
    ctx.fillStyle = 'rgba(74,96,128,0.5)';
    ctx.font = '11px JetBrains Mono';
    ctx.textAlign = 'center';
    ctx.fillText('No data', W/2, H/2);
    return;
  }

  const closes = candles.map(c=>parseFloat(c[4]));
  const highs  = candles.map(c=>parseFloat(c[2]));
  const lows   = candles.map(c=>parseFloat(c[3]));
  const opens  = candles.map(c=>parseFloat(c[1]));

  const minP = Math.min(...lows);
  const maxP = Math.max(...highs);
  const range = maxP - minP || 1;
  const pad   = 16;
  const cW    = W / candles.length;

  const toY = v => pad + ((maxP-v)/range) * (H-pad*2);
  const toX = i => i * cW + cW/2;

  candles.forEach((c,i) => {
    const o=parseFloat(c[1]), cl=parseFloat(c[4]), h=parseFloat(c[2]), l=parseFloat(c[3]);
    const bull = cl >= o;
    const col  = bull ? '#00E5A0' : '#FF3D6B';
    const bW   = Math.max(cW*0.6, 2);

    // Wick
    ctx.strokeStyle = col;
    ctx.lineWidth   = 1;
    ctx.beginPath();
    ctx.moveTo(toX(i), toY(h));
    ctx.lineTo(toX(i), toY(l));
    ctx.stroke();

    // Body
    ctx.fillStyle = bull ? 'rgba(0,229,160,0.8)' : 'rgba(255,61,107,0.8)';
    const y1 = toY(Math.max(o,cl));
    const y2 = toY(Math.min(o,cl));
    ctx.fillRect(toX(i)-bW/2, y1, bW, Math.max(y2-y1, 1));
  });

  // Last price line
  const lastY = toY(closes[closes.length-1]);
  ctx.setLineDash([3,3]);
  ctx.strokeStyle = 'rgba(0,200,255,0.3)';
  ctx.lineWidth   = 1;
  ctx.beginPath(); ctx.moveTo(0,lastY); ctx.lineTo(W,lastY); ctx.stroke();
  ctx.setLineDash([]);
}

    </div>
    <button style="width:100%;margin-top:12px;padding:12px;background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.25);border-radius:12px;color:var(--cyan);font-family:var(--font-data);font-size:12px;cursor:pointer;letter-spacing:0.06em" onclick="renderSignals()">↻ REFRESH ALL</button>
    <div style="margin-top:10px;font-family:var(--font-data);font-size:10px;color:var(--muted);text-align:center">Fast scan — no vision. Tap Markets to get full AI analysis.</div>
  </div>`;

  // Load signals for each pair using price data + basic calc (no API cost)
  for (const pair of PAIRS) {
    try {
      const p = getPair(pair);
      const priceEl  = document.getElementById(`sigcard-price-${pair}`);
      const actionEl = document.getElementById(`sigcard-action-${pair}`);
      const confEl   = document.getElementById(`sigcard-conf-${pair}`);
      const reasonEl = document.getElementById(`sigcard-reason-${pair}`);
      if (priceEl && p) priceEl.textContent = fmtPrice(p.price, pair) + ' · ' + (p.change24h>=0?'+':'') + p.change24h + '%';

      if (serverOnline && cfg.botToken) {
        const r = await api(`/api/signal/${pair}`).catch(()=>null);
        if (r?.data) {
          const s = r.data;
          const col = s.action==='BUY'?'var(--green)':s.action==='SELL'?'var(--red)':'var(--amber)';
          if (actionEl) { actionEl.textContent=s.action; actionEl.style.background=col+'22'; actionEl.style.color=col; actionEl.style.borderColor=col+'44'; }
          if (confEl)   confEl.textContent = s.confidence+'%';
          if (reasonEl) reasonEl.textContent = s.signals?.[0] || 'No dominant signal';
        }
      } else {
        if (actionEl) { actionEl.textContent='--'; }
        if (reasonEl) reasonEl.textContent = 'Connect server for signals';
      }
    } catch {}
    await new Promise(r=>setTimeout(r,200));
  }
}

// ── Init ───────────────────────────────────────────────────────
async function init() {
  await checkServer();
  await refreshPrices();
  await refreshBalance();
  renderDashboard();
  setInterval(refreshPrices, 30000);
  setInterval(checkServer, 60000);
  setInterval(refreshBalance, 15000);
}

init();
</script>
